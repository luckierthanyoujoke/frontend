# Railway config for the Next.js UI (service root directory: frontend/)
# In the Railway dashboard → Service → Settings → Config file path: /frontend/railway.toml
#
# NEXT_PUBLIC_* variables must exist on this service before build (Railway passes matching ARG names).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/frontend/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
